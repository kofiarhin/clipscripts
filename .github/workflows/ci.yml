# Temporary diagnostic PR workflow; this branch is not intended for merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: npm run lint 2>&1 | tee lint.log

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: npm test 2>&1 | tee test.log

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: npm run build 2>&1 | tee build.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: |
            lint.log
            test.log
            build.log
          if-no-files-found: error

      - name: Upload generated lockfile
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Enforce verification result
        if: always()
        shell: bash
        run: |
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.test.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
